info:
  contact: {}
  description: League service with Google sign-in and server-side sessions.
  title: League API
  version: "1.0"
paths:
  /auth/google/callback:
    get:
      description: Verifies state and the ID token, upserts the user, issues the sid
        + csrf cookies, then 302s to the frontend. Called by Google, never by the
        SPA.
      parameters:
      - description: authorization code from Google
        in: query
        name: code
        required: true
        type: string
      - description: opaque state, must match the oauth_tx cookie
        in: query
        name: state
        required: true
        type: string
      - description: set by Google when the user cancels
        in: query
        name: error
        type: string
      responses:
        "302":
          description: redirect to FRONTEND_URL/login?error=cancelled|login_failed|server_error
      summary: Google OAuth callback
      tags:
      - auth
  /auth/google/login:
    get:
      description: Sets the sealed oauth_tx cookie and 302s to Google. Open this in
        the browser, not from Swagger UI's "Try it out" — it is a navigation, not
        an XHR.
      responses:
        "302":
          description: redirect to FRONTEND_URL/login?error=server_error
      summary: Start Google sign-in
      tags:
      - auth
  /auth/logout:
    post:
      description: Deletes the session row and clears the sid + csrf cookies. A user
        has one session, so this signs them out everywhere.
      produces:
      - application/json
      responses:
        "204":
          description: signed out
        "403":
          description: 403001 CSRF_COOKIE_ABSENT | 403002 CSRF_TOKEN_MISMATCH
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
        "500":
          description: 500001 INTERNAL
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
      security:
      - CSRFToken: []
      summary: Sign out
      tags:
      - auth
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/platform_router.HealthResponse'
      summary: Liveness check
      tags:
      - health
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.SuccessResponse-auth_CurrentUserResponse'
        "401":
          description: 401001 SESSION_COOKIE_ABSENT | 401002 SESSION_INVALID | 401003
            USER_NOT_IN_CONTEXT
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
      summary: Current user
      tags:
      - auth
  /permissions:
    get:
      description: 'The catalog is a fixed vocabulary, returned whole. It is read-only
        over HTTP: codes are compared by authorization code elsewhere in the backend,
        so they are added and removed by migration.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.SuccessResponse-array_permissions_PermissionResponse'
        "401":
          description: 401001 SESSION_COOKIE_ABSENT | 401002 SESSION_INVALID
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
        "403":
          description: 403005 PERMISSION_DENIED
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
      summary: List permissions
      tags:
      - permissions
  /permissions/{id}:
    get:
      parameters:
      - description: permission id (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.SuccessResponse-permissions_PermissionResponse'
        "400":
          description: 400001 VALIDATION_FAILED
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
        "404":
          description: 404001 NOT_FOUND
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
      summary: Get a permission
      tags:
      - permissions
  /roles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.SuccessResponse-array_roles_RoleResponse'
        "401":
          description: 401001 SESSION_COOKIE_ABSENT | 401002 SESSION_INVALID
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
        "403":
          description: 403005 PERMISSION_DENIED
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
      summary: List roles
      tags:
      - roles
    post:
      consumes:
      - application/json
      description: '`code` is the authorization contract and cannot be changed afterwards.'
      parameters:
      - description: role to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/roles.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.SuccessResponse-roles_RoleResponse'
        "400":
          description: 400001 VALIDATION_FAILED
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
        "403":
          description: 403001 CSRF_COOKIE_ABSENT | 403002 CSRF_TOKEN_MISMATCH | 403005
            PERMISSION_DENIED
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
        "409":
          description: 409001 CONFLICT
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
      security:
      - CSRFToken: []
      summary: Create a role
      tags:
      - roles
  /roles/{id}:
    delete:
      description: 'Soft delete: the role is hidden and everyone holding it loses
        what it granted at once. Its grants and holders are kept until DELETE /roles/{id}/permanent.
        SUPER_ADMIN cannot be deleted.'
      parameters:
      - description: role id (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: deleted
        "404":
          description: 404001 NOT_FOUND
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
        "409":
          description: 409001 CONFLICT (SUPER_ADMIN)
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
      security:
      - CSRFToken: []
      summary: Delete a role
      tags:
      - roles
    get:
      parameters:
      - description: role id (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.SuccessResponse-roles_RoleResponse'
        "400":
          description: 400001 VALIDATION_FAILED
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
        "404":
          description: 404001 NOT_FOUND
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.ErrorResponse'
      summary: Get a role
      tags:
      - roles
    patch:
      consumes:
      - application/json
      description: 'Partial update: an absent field is left unchanged. `code` cannot
        be changed — create a new role instead.'
      parameters:
      - description: role id (uuid)
        in: path
        name: id
        required: true
        type: string
      - description: fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/roles.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_nguyentanvinh_league-be_internal_platform_handler.SuccessResponse-roles_RoleResponse'
