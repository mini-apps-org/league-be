server:
  port: 9200
  graceful_shutdown_in_second: 5
  read_timeout_in_second: 10
  write_timeout_in_second: 100

# Pool sizing and lifetimes only. Host, name, credentials and sslmode are
# secrets or per-machine values, so they come from the environment instead.
database:
  max_conns: 10
  min_conns: 2
  max_conn_lifetime_in_minute: 60
  max_conn_idle_time_in_minute: 30
  connect_timeout_in_second: 5

auth:
  google_oauth_redirect_url: http://localhost:9200/api/v1/auth/google/callback

app_base_url:
  frontend: http://localhost:5174

domains:
  # Every origin here may make credentialed requests, so each entry can read an
  # authenticated response. Keep the list to origins we actually serve the SPA from.
  allowed_origins:
    - http://localhost:*
    - https://localhost:*
