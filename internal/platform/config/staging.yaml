server:
  port: 5001
  graceful_shutdown_in_second: 5
  read_header_timeout_in_second: 10
  read_timeout_in_second: 10
  write_timeout_in_second: 100
  idle_timeout_in_second: 120

# Pool sizing and lifetimes only. Host, name, credentials and sslmode are
# secrets or per-machine values, so they come from the environment instead.
database:
  max_conns: 20
  min_conns: 4
  max_conn_lifetime_in_minute: 60
  max_conn_idle_time_in_minute: 30
  connect_timeout_in_second: 5

auth:
  google_oauth_redirect_url: https://be.mvip-league.com/api/v1/auth/google/callback

app_base_url:
  frontend: https://www.mvip-league.com

domains:
  # Every origin here may make credentialed requests, so each entry can read an
  # authenticated response. Name preview deployments explicitly — a wildcard such
  # as https://*.vercel.app would let any site on that host read a signed-in
  # user's data.
  allowed_origins:
    - https://www.mvip-league.com
