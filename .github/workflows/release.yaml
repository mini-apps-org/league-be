name: Build and Push to Artifact Registry

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

env:
  GAR_LOCATION: asia-southeast1
  GAR_PROJECT_ID: vincent-mini-apps-project
  GAR_REPOSITORY: league-repository
  IMAGE_NAME: league-service
  WORKLOAD_IDENTITY_PROVIDER: projects/225614846438/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions@vincent-mini-apps-project.iam.gserviceaccount.com

jobs:
  # Same gates a pull request faces, so a tag cannot ship code that would
  # have failed CI on the way in.
  verify:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: latest

      - name: Check Formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -race ./...

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: verify

    # id-token: write is what lets the runner mint the OIDC token that
    # Workload Identity Federation exchanges for a GCP access token.
    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2.1.13
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}
          # latest=false is required: the default (latest=auto) appends a
          # "latest" tag on tag events even when it isn't listed below.
          flavor: latest=false
          # One image tag, verbatim from the pushed Git tag.
          tags: |
            type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VERSION is stamped into the binary via -ldflags in the Dockerfile.
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Reports the end of the pipeline either way. A failed verify skips
  # build-and-push, so anything short of its success is a failed release.
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [verify, build-and-push]
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout Slack Templates
        uses: actions/checkout@v4.4.0
        with:
          sparse-checkout: .github/slack

      # The action only substitutes ${{ env.* }} and ${{ github.* }} in a
      # payload file, so every value the templates need is passed as env.
      - name: Post to Slack
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload-file-path: ${{ needs.build-and-push.result == 'success' && '.github/slack/release-success.yaml' || '.github/slack/release-failure.yaml' }}
          payload-templated: true
